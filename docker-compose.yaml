services:
  tools:
    build:
      context: .
      dockerfile: Dockerfile_for_tools
    container_name: tools
    stdin_open: true
    tty: true
  broker:
    image: apache/kafka:3.8.0
    container_name: broker
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - ./kafka_data:/var/lib/kafka/data
  clickhouse:
    image: dockerhub.timeweb.cloud/clickhouse/clickhouse-server:26.7.3.19
    container_name: clickhouse
    environment:
      AWS_ACCESS_KEY_ID: "${MINIO_ROOT_USER}"
      AWS_SECRET_ACCESS_KEY: "${MINIO_ROOT_PASSWORD}"
      AWS_DEFAULT_REGION: us-east-1
    restart: unless-stopped
    volumes:
      - ./clickhouse_data:/var/lib/clickhouse
      - ./clickhouse_default-user.xml:/etc/clickhouse-server/users.d/default-user.xml
  postgres:
    image: dockerhub.timeweb.cloud/postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
  mysql:
    image: mysql:8.0
    container_name: mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    restart: unless-stopped
    volumes:
      - ./mysql_data:/var/lib/mysql

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    ports:
      - "9001:9001"
    volumes:
      - ./minio_data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: minio-init
    restart: "no"
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}"
    entrypoint: ["/bin/sh", "-c"]
    command: ["until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done; mc mb -p local/raw"]

  generator:
    build:
      context: .
      dockerfile: Dockerfile_for_generator
    profiles: ["seed"]
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: "${POSTGRES_USER}"
      PG_PASSWORD: "${POSTGRES_PASSWORD}"
      PG_DB: marketplace
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_DB: dict
      KAFKA_BOOTSTRAP: broker:9092
      KAFKA_TOPIC: user_activity

networks:
  default:
    external: true
    name: lev_diploma_net
